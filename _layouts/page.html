---
layout: default
---

<div class="wrap">

    {% if page.title %}
    <header class="page-head">
        {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="deck">{{ page.description }}</p>{% endif %}
    </header>
    {% endif %}

    <div class="sheet">
        {{ content }}
    </div>

</div>
