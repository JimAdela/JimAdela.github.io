# 诗。从《散诗集》《无题诗集》按首拆出。不要写回 _posts，否则会回到首页。
# group: san | wu
# date: 原稿上的日期。没有就空着，不补。
# 《西装无题 一》正文是青稞与赤烈，且与《西藏无题 二》成对，标题按正文改回《西藏无题 一》。

# ----- 散诗 -----

- title: "问道"
  group: san
  date: "2019-06-10"
  lines:
    - "转念太匆匆，"
    - "来去皆成空。"
    - "光阴无岁月，"
    - "何如与道同。"

- title: "观暗恋桃花源后作"
  group: san
  date: "2017-02-07"
  lines:
    - "枝头桃花缤纷少，"
    - "空情只余桃花笑。"
    - "春风不解人间事，"
    - "花香暗渡暮与朝。"

- title: "致飞逝的过去"
  group: san
  date: "2016-12-31"
  lines:
    - "手里紧握着沉默的流砂"
    - "指尖却逃走了青春年华"
    - "它们循着风的足迹窃窃私语"
    - "在月光的指引下聚散为家"
    - "它们厌倦漂泊　宁静的任流水徜徉"
    - "它们留恋温暖　固执地等待夕阳染尽红霞"
    - "它们彼此遗忘　却总在星光漫天的时候"
    - "化成你的模样"

- title: "求索者"
  group: san
  date: "2016-11-11"
  lines:
    - "密涅瓦的猫头鹰"
    - "在黄昏时才会起飞"
    - "沉思者的过去"
    - "展望者的未来"
    - "飞翔从来不是一种孤高"
    - "游离从来不是一种冷傲"
    - "漫漫星空的流水里"
    - "徜徉着的是"
    - "自由者的骄傲"

- title: "十六的月儿"
  group: san
  date: "2016-09-16"
  lines:
    - "十五雨敲窗，"
    - "十六横长江。"
    - "奕奕孤芳月，"
    - "径自绽明光。"

- title: "题西安都城隍庙"
  group: san
  lines:
    - "城隍庙外钟声早，本命殿前刻石雕。"
    - "众生有信爱意迟，今日何妨又寥寥。"

- title: "听雨"
  group: san
  date: "2016-05-23"
  lines:
    - "春风拂柳映微澜，"
    - "西湖五月雨漫漫。"
    - "人生悠悠白云处，"
    - "心且慢慢行且缓。"

- title: "西藏无题 二"
  group: san
  date: "2016-04-04"
  lines:
    - "心惶惶路茫茫，飞鸟振翅欲所向。"
    - "蜉蝣一梦流光逝，寸寸青丝悲无常。"

- title: "西藏无题 一"
  group: san
  date: "2015-11-15"
  lines:
    - "青天远上白云间，山色起伏若等闲。"
    - "秋日赤烈不更色，青稞麦浪风过肩。"

- title: "霜满楼"
  group: san
  date: "2014-12-22"
  lines:
    - "寒风拂晚照，明月入江流。"
    - "叶落花不语，深山谁人忧。"
    - "山有长青树，水中宫阙楼。"
    - "翩翩弄清影，喟然独倚舟。"

- title: "从军行"
  group: san
  date: "2014-12-05"
  lines:
    - "墨色丹青谁执笔，清音一缕谁抚琴。"
    - "山外荒山云外云，而今迈步从军行。"

- title: "居双流有感"
  group: san
  date: "2014-12-04"
  lines:
    - "万里红旗风飘扬，一别经年梦他乡。"
    - "此去西风路渐离，男儿有梦心痴狂。"
    - "彩云追月没流光，青石空朔水更长。"
    - "应有沧海凌云志，敢向风雨搏苍黄。"

- title: "路望江所感"
  group: san
  date: "2013-09-07"
  lines:
    - "九月乘风好还家，"
    - "望江江流天地长。"
    - "此去鹅湖无多路，"
    - "东风渐起离别殇。"

- title: "夜临长江"
  group: san
  date: "2013-08-23"
  lines:
    - "长江横月水遮天，微风荡起云万千。"
    - "又是一年江渚上，渺渺音容难忘天。"

- title: "赠别"
  group: san
  date: "2013-08-21"
  lines:
    - "自古有离愁，离别恨悠悠。"
    - "千山路已尽，何时同泛舟？"
    - "秋风悲落叶，月静水自流。"
    - "听风赠烟雨，高歌别行云。"

- title: "忙里偷闲"
  group: san
  date: "2013-08"
  lines:
    - "蝉鸣清溪上，风闲动莲洲。"
    - "苍山遮暮色，欲语还俱休。"

- title: "夜作二"
  group: san
  date: "2013-07-23"
  lines:
    - "平生不修边幅，无为难说碌碌。"
    - "心系自家蛙池，三言当做两语。"
    - "低头梦断前世，仰笑华年温语。"
    - "怎堪心系瑶琴？当为明月低语。"

- title: "夜作"
  group: san
  date: "2013-07"
  lines:
    - "任笑一生付天清，两处闲暇居山亭。"
    - "薄雾织纱系青山，溪水难断沙难清。"

- title: "长风歌"
  group: san
  date: "2013-06-14"
  lines:
    - "千里相思长风飘，累累红尘华年少。"
    - "青云当歌声纵横，风扬扶摇上九霄。"

- title: "南飞雁"
  group: san
  date: "2013-06-14"
  lines:
    - "青云彼端，飘荡着南飞雁。"
    - "雁回青天，孤灯半盏。夜雨朦胧，惊鸿相逢。"
    - "青灯渺渺，余音缭绕。等待，下一站。"
    - "沉积的忧伤燃烧。"
    - "远方云烟，盼南归飞雁。"
    - "飞上青天，相逢云海之巅。"
    - "断鸿梦处，悠悠千年。"

- title: "墨迹"
  group: san
  date: "2012-07-16"
  lines:
    - "清月梧桐寂寞秋，云深别影谁堪愁。"
    - "等闲泼墨天地醉，道是孤影上寒楼。"

# ----- 无题 -----

- title: "无题 一"
  group: wu
  date: "2013"
  lines:
    - "孤星成峰黯月称微，独落高阁良辰应醉。"
    - "无人莫问青丝已老，常言却道泪劫成灰。"

- title: "无题 二"
  group: wu
  date: "2013"
  lines:
    - "梦里花落几许，常思不知归处。"
    - "笑叹华年倒影，只恨人生朝暮。"

- title: "无题 三"
  group: wu
  date: "2013"
  lines:
    - "凭栏越江鸿声断，晓梦方觉月已寒。"
    - "唯寄愁心托孤雁，此情流离半生还。"

- title: "无题 四"
  group: wu
  date: "2013"
  lines:
    - "雨狂雪嚎一线天，回首相顾两茫茫。"
    - "自是人生萧瑟处，西风错漏东风伤。"

- title: "无题 五"
  group: wu
  date: "2013"
  lines:
    - "愁眉低锁霜满江，雾霭沉沉天苍茫。"
    - "行路且凭风吹雨，望断天涯人断肠。"

- title: "无题 六"
  group: wu
  date: "2013"
  lines:
    - "淡观世间诸般果，平却浮华一世人。"
    - "愿待高山期流水，此曲应醉天上人。"

- title: "无题 七"
  group: wu
  date: "2013"
  lines:
    - "月上柳梢黄昏后，疏影依旧。"
    - "风过痕难消，飘然零落，满地枫火。"
    - "应是啼鸟怨东风？此情空转无有时。"

- title: "无题 八"
  group: wu
  date: "2013"
  lines:
    - "潇湘流水舞袖回，枫花零落伊人醉。"
    - "梦落他乡身是客，浮云似水流年归。"

- title: "无题 九"
  group: wu
  date: "2013-06-08"
  lines:
    - "朗朗读书院，默默少年行。"
    - "寸寸青丝老，悠悠哀情生。"
    - "埋头复春梦，何以赴前程。"
    - "寒蝉日未了，鸣泣悲浮生"

- title: "无题 十"
  group: wu
  date: "2013-06-14"
  lines:
    - "杨柳青丝花柳衣，荷为云裳雨为绮。"
    - "梦入小湖随天画，日月浮游长歌行。"
    - "孤灯夜雨声半盏，碧海青天终不怨。"
    - "此景依依梦将逝，只是空余惘然情。"

- title: "无题 十一"
  group: wu
  date: "2013-06-15"
  lines:
    - "燕子归时月如钩。"
    - "月如钩，一洗满江别时愁。"
    - "独语对天休。"
    - "蝶恋青花华年愁。"
    - "华年愁，十里相思花满楼。"
    - "风吟倾水流。"

- title: "无题 十二"
  group: wu
  date: "2013-07-31"
  lines:
    - "云影弄怜月，鸿雁绕故枝。"
    - "鸣琴青山悦，挥泪执相思。"

- title: "无题 十三"
  group: wu
  date: "2013-08-27"
  lines:
    - "夜阑星火沧海明，霜愁明镜悲古今。"
    - "青山有情蒙白发，人间正道事别离。"

- title: "无题 十四"
  group: wu
  date: "2017-03-27"
  lines:
    - "三月花期归，晴空万里随。"
    - "松涛迎旧识，平地闻惊雷。"
    - "偶有林间客，拾得彩云归。"
    - "若问来者意，年年何者谁"

- title: "无题 十五"
  group: wu
  date: "2017-04-20"
  lines:
    - "青山循小径，流水悠悠行。"
    - "落叶知春意，化作泥上尘。"
    - "碧莲音声渺，岁月难相倾？"
    - "又是春风季，今思何夕夕。"

- title: "无题 十六"
  group: wu
  date: "2018-09-25"
  lines:
    - "人生何处不相逢，纵是相逢也匆匆。"
    - "匆匆过客过匆匆，只是江海月明中。"

- title: "无题 十七"
  group: wu
  date: "2018-12-08"
  lines:
    - "落而无声"
    - "空中却燃起光与尘"
    - "未若柳絮之动"
    - "何因风声而鸣"
    - "飘飘之无所似"
    - "袅袅兮何依寻"
