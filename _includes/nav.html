<!-- 顶栏：站名 + 导航 + 阅读进度 -->
<header class="masthead">
    <div class="masthead-in">
        <a class="site-mark" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <nav class="site-nav" aria-label="主导航">
            <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="is-on" aria-current="page"{% endif %}>首页</a>
            <a href="{{ site.baseurl }}/tags/"{% if page.url contains "/tags" %} class="is-on" aria-current="page"{% endif %}>标签</a>
            <a href="{{ site.baseurl }}/about/"{% if page.url contains "/about" %} class="is-on" aria-current="page"{% endif %}>关于</a>
            <a href="{{ site.baseurl }}/feed.xml">RSS</a>
        </nav>
    </div>
    <div class="progress" aria-hidden="true"><i id="js-progress"></i></div>
</header>
