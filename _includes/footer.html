<!-- 页脚 -->
<footer class="colophon">
    <div class="colophon-in">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</span>
        <span>
            <a href="{{ site.baseurl }}/feed.xml">RSS</a> ·
            <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
            <a href="{{ site.github_repo }}">源码</a>
        </span>
    </div>
</footer>

<script src="{{ "/js/paper.js" | prepend: site.baseurl }}" defer></script>

<!-- Service Worker -->
{% if site.service-worker %}
<script type="text/javascript">
    if(navigator.serviceWorker){
        // For security reasons, a service worker can only control the pages that are in the same directory level or below it. That's why we put sw.js at ROOT level.
        navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {console.log('Service Worker Registered. ', registration)})
            .catch((error) => {console.log('ServiceWorker registration failed: ', error)})
    }
</script>
{% endif %}

<!-- Google Analytics -->
{% if site.ga_track_id %}
<script>
    var _gaId = '{{ site.ga_track_id }}';
    var _gaDomain = '{{ site.ga_domain }}';

    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

    ga('create', _gaId, _gaDomain);
    ga('send', 'pageview');
</script>
{% endif %}

<!-- Baidu Tongji -->
{% if site.ba_track_id %}
<script>
    var _baId = '{{ site.ba_track_id }}';

    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "//hm.baidu.com/hm.js?" + _baId;
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
</script>
{% endif %}
