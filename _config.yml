# Site settings
title: 无意 Blog
SEOTitle: 不笑不足以为道 | 无意 Blog
header-img: img/post-bg-desk.jpg
email: 1608808586@qq.com
description: "Every failure is leading towards success."
keyword: "WY, WY Blog, 无意的博客, wuyi, 孙兵, AI数学, 深度学习, Transformer, 大语言模型, Laravel, PostgreSQL, PHP, MySQL, Python"
url: "https://jimadela.github.io"          # your host, for absolute URL
baseurl: ""      # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/JimAdela/JimAdela.github.io.git" # you code repository

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "Goals determine what you going to be!"
sidebar-avatar: /img/avatar_m.jpg      # use absolute URL, seeing it's used in both `/` and `/about/`



# SNS settings
RSS: true
# weibo_username:     qiubaiying
zhihu_username:
github_username:
facebook_username:
jianshu_username:
#twitter_username:   qiubaiying




# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
# 文章 date 只写到日，按北京时间解释。不设时 GitHub Pages 按 UTC 构建，
# 早上 8 点前推送的当天文章会被当成「未来文章」静默跳过。
timezone: Asia/Shanghai
exclude: ["node_modules","README.md","scripts","CONTENT-PLAN.md","_templates","_design"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# jekyll-sitemap 由 GitHub Pages 官方支持，构建时自动生成 sitemap.xml
plugins:
  - jekyll-paginate
  - jekyll-sitemap




# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
# Gitalk 已停用：它的 clientSecret 必须下发到浏览器，等于把 OAuth 密钥公开在页面里。
# 改用 giscus（基于 GitHub Discussions，前端不需要任何密钥）。
# 启用只需两步（约 2 分钟）：
#   1. 给仓库开启 Discussions，并新建一个 Announcement 类型的分类
#   2. 打开 https://giscus.app ，填仓库名，把生成的 data-repo-id 与 data-category-id 抄到下面
# 两个 id 都填上之后评论框才会出现；留空则整段脚本不加载，不会报错。
giscus:
  enable: true
  repo: "jimadela/jimadela.github.io"
  repo_id: ""            # 例：R_kgDOxxxxxxx
  category: "Announcements"
  category_id: ""        # 例：DIC_kwDOxxxxxxxxxx
  mapping: pathname
  reactions_enabled: 1
  emit_metadata: 0
  input_position: top
  lang: zh-CN


# 统计

# Analytics settings
# Baidu Analytics
ba_track_id: b50bf2b12b5338a1845e33832976fd68

# Google Analytics
# Universal Analytics（UA-136597966-1）已于 2023-07 停止收数，脚本留着只是空转。
# 拿到 GA4 的 G-XXXXXXX 后，把下面一行取消注释并填进去即可；留空时不加载任何脚本。
# ga_track_id: 'G-XXXXXXXXXX'





# Featured Tags
featured-tags: true                     # 是否使用首页标签
featured-condition-size: 1              # 相同标签数量大于这个数，才会出现在首页



# Progressive Web Apps
chrome-tab-theme-color: "#FCFBF8"
service-worker: true



